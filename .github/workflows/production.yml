name: Deploy to Production

# Manual deploys only: Actions > Deploy to Production > Run workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list what would change, upload nothing)"
        type: boolean
        default: true
      delete_extra:
        description: "Delete server files that are not in the repo (excluded paths stay protected)"
        type: boolean
        default: false

# Never run two deployments at the same time; queue instead of cancelling mid-upload.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Folder that gets uploaded: the static export produced by "next build".
  DEPLOY_DIR: "out"

jobs:
  deploy:
    name: Deploy via rsync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Validate secrets
        env:
          PRD_APP_DIR: ${{ secrets.PRD_APP_DIR }}
          PRD_HOST: ${{ secrets.PRD_HOST }}
          PRD_SSH_KEY: ${{ secrets.PRD_SSH_KEY }}
          PRD_USER: ${{ secrets.PRD_USER }}
        run: |
          set -euo pipefail
          for name in PRD_APP_DIR PRD_HOST PRD_SSH_KEY PRD_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing or empty."
              exit 1
            fi
          done
          # Guard against an accidental deploy to the server root.
          case "${PRD_APP_DIR%/}" in
            ""|"/"|"~")
              echo "::error::PRD_APP_DIR must be a specific site directory, not the server root."
              exit 1
              ;;
          esac

      - name: Configure SSH
        env:
          PRD_HOST: ${{ secrets.PRD_HOST }}
          PRD_SSH_KEY: ${{ secrets.PRD_SSH_KEY }}
          SSH_PORT: ${{ vars.PRD_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRD_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$PRD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        env:
          PRD_APP_DIR: ${{ secrets.PRD_APP_DIR }}
          PRD_HOST: ${{ secrets.PRD_HOST }}
          PRD_USER: ${{ secrets.PRD_USER }}
          SSH_PORT: ${{ vars.PRD_SSH_PORT || '22' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          DELETE_EXTRA: ${{ github.event_name == 'workflow_dispatch' && inputs.delete_extra }}
        run: |
          set -euo pipefail

          OPTS=(
            --archive
            --compress
            --itemize-changes
            --human-readable
            --no-owner
            --no-group
            --chmod=D755,F644
          )

          # Paths that must never be uploaded, overwritten or deleted on the server.
          EXCLUDES=(
            --exclude='/old_backup/'
            --exclude='.htaccess'
            --exclude='.user.ini'
            --exclude='.git/'
            --exclude='.github/'
            --exclude='.gitignore'
            --exclude='node_modules/'
          )

          [ "$DRY_RUN" = "true" ]      && OPTS+=(--dry-run)
          [ "$DELETE_EXTRA" = "true" ] && OPTS+=(--delete)

          echo "Dry run: $DRY_RUN | Delete extra files: $DELETE_EXTRA"

          rsync "${OPTS[@]}" "${EXCLUDES[@]}" \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            "${DEPLOY_DIR%/}/" \
            "${PRD_USER}@${PRD_HOST}:${PRD_APP_DIR%/}/"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
